# Environment profile: `prod` — GIC production, customer data (never writes to the external DB). COPY OF demo.yaml: fill every REPLACE-ME before `make all TARGET=prod`.
# One file per environment (design §4.1). Nothing environment-specific lives in code.
# Secret VALUES are never stored here: they come from env vars at `make infra` time
# (EQDS_AZURE_SQL_USER / EQDS_AZURE_SQL_PASSWORD) and live only in the secret scope.
target: prod
name_prefix: eqds
workspace_host: https://REPLACE-ME.cloud.databricks.com
cloud: aws                    # aws | azure | gcp
serverless_env_version: "3"
region: ap-southeast-1
catalog: eqds
schema: prod
suffix: ""
data_profile: customer
external_db_mode: direct      # the external database is read through the foreign catalog (Lakehouse Federation)
foreign_catalog: azure_oms
connection: azure_oms_conn
azure_sql:
  host: oneenvsql.database.windows.net
  port: 1433
  database: oneenvsqldb
  auth: sql_login             # sql_login | entra_sp
lakebase:
  project: eqds-lakebase      # Lakebase Autoscaling project id (prefix + env)
  branch: production
  database: eqds_prod
  app_db_schema_prefix: ""
vector_search_endpoint: eqds-vs
genie_space_id: ""            # written by job_env_bootstrap (bootstrap output); override if you own one
policies: {ingest: ""}      # cluster policy IDs/names; "" = no policy (demo)
node_types: {ingest: md-fleet.xlarge}
spark_version: 17.3.x-scala2.13
secret_scope: eqds-bridge
service_principals: {ci: "", ingest: "", wiki: "", seed: "", registrar: ""}   # "" = run as deployer; registrar: `make registrar`
models_config: config/models.prod.yaml
model_serving:                  # embedding endpoint for Vector Search (the only serving endpoint) + AI Gateway model-service limits
  scale_to_zero: true
  embed_entity: system.ai.gte_large_en_v1_5
  embed_version: "1"
  pt_min: 0                     # provisioned throughput (tokens/s), multiples of the model's chunk size (19000 for gte-large)
  pt_max: 19000
  rate_limits: {user_per_min: 300, endpoint_per_min: 1200}   # per calling principal / per model service, requests per minute
web_search:                  # live web search from the specialist agents: one fixed vendor endpoint, key in secret_scope
  mode: stub                # stub = demo web_index table (nothing leaves the workspace); vendor = live search
  vendor: youdotcom
  endpoint: https://ydc-index.io/v1/search
  secret_key: youdotcom-api-key   # secret in secret_scope; set from env EQDS_YOUDOTCOM_API_KEY by `make infra`
  timeout_s: 15
network:
  serverless_blocked: false        # true where the external DB firewall blocks serverless egress; validate_seed asserts this matches reality
flags:
  use_managed_memory: false
  use_uc_skills: false
  use_prompt_registry: false
  use_uc_trace_storage: false
  use_managed_mcp: false        # false = SDK adapters. GIC workspace (shared by dev, staging and prod; C-04): managed MCP not enabled there yet. When enabled: set true and scale_to_zero false in all three together, then run preflight
ui: {app_name: "EQDS Research", subtitle: "Multi-agent research platform", demo_player: true}
schedules:
  enabled: false                # true = wiki refresh and news ingest run on their cron (costs model tokens)
  wiki_refresh_cron: "0 30 7 * * ?"
  wiki_refresh_tz: Asia/Singapore
  ingest_news_cron: "0 */15 * * * ?"
experiment_path: /Shared/eqds/prod
specialists_deploy: [efm, ours, emquant, broker, experts, news, research, earnings, georev]
github_repo_url: ""
