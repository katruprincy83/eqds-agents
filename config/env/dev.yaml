# Environment profile: `dev` — the pre-production environment (git branch `dev`), synthetic data. It lives in the SAME workspace as `demo`
# (production), so every name that could collide is different: apps and jobs carry `-dev`, catalog eqds_dev, Lakebase branch `dev`,
# experiments under /Shared/eqds-dev, traces in eqds_dev.traces. What dev deliberately shares with demo is listed under `shared_external`.
# Promotion: push to `dev` deploys this profile; merging to `main` deploys `demo` (docs/cicd.md).
# One file per environment (design §4.1). Nothing environment-specific lives in code.
# Secret VALUES are never stored here: they come from env vars at `make infra` time
# (EQDS_AZURE_SQL_USER / EQDS_AZURE_SQL_PASSWORD) and live only in the secret scope.
target: dev
name_prefix: eqds
workspace_host: https://dbc-6ab9fd5d-c871.cloud.databricks.com
cloud: aws                    # aws | azure | gcp
serverless_env_version: "3"
region: ap-southeast-1
catalog: eqds_dev
schema: dev
suffix: -dev
data_profile: synthetic       # synthetic | customer
external_db_mode: direct      # the external database is read through the foreign catalog (Lakehouse Federation)
foreign_catalog: azure_oms
connection: azure_oms_conn
azure_sql:
  host: oneenvsql.database.windows.net
  port: 1433
  database: oneenvsqldb
  auth: sql_login             # sql_login | entra_sp
lakebase:
  project: eqds-lakebase      # Lakebase Autoscaling project id (prefix + env)
  branch: dev                 # Lakebase branch created from `production` by `make infra` (copy-on-write); registry/mem/ops/lg are reset on it
  database: eqds_prod
  app_db_schema_prefix: ""
vector_search_endpoint: eqds-vs
genie_space_id: ""            # written by job_env_bootstrap (bootstrap output); override if you own one
policies: {ingest: ""}      # cluster policy IDs/names; "" = no policy (demo)
node_types: {ingest: md-fleet.xlarge}
spark_version: 17.3.x-scala2.13
secret_scope: eqds-bridge
service_principals: {ci: "", ingest: "", wiki: "", seed: "", registrar: "a22a69d2-3acb-4cb7-ad65-4bacfcefae1c"}   # "" = run as deployer; registrar: `make registrar`
registrar_job_identity: deployer   # registrar | deployer. deployer until an admin grants the deployer (and the CI service principal) 'Service Principal User' on eqds-registrar-dev; then delete this line
models_config: config/models.dev.yaml
model_serving:                  # embedding endpoint for Vector Search (the only serving endpoint) + AI Gateway model-service limits
  scale_to_zero: false          # false: cold starts on the embedding endpoint cancel managed Vector Search calls
  embed_entity: system.ai.gte_large_en_v1_5
  embed_version: "1"
  pt_min: 0                     # provisioned throughput (tokens/s), multiples of the model's chunk size (19000 for gte-large)
  pt_max: 19000
  rate_limits: {user_per_min: 300, endpoint_per_min: 1200}   # per calling principal / per model service, requests per minute
web_search:                  # live web search from the specialist agents: one fixed vendor endpoint, key in secret_scope
  mode: stub                # (dev: no You.com spend) stub = demo web_index table (nothing leaves the workspace); vendor = live search
  vendor: youdotcom
  endpoint: https://ydc-index.io/v1/search
  secret_key: youdotcom-api-key   # secret in secret_scope; set from env EQDS_YOUDOTCOM_API_KEY by `make infra`
  timeout_s: 15
network:
  serverless_blocked: false       # true where the external DB firewall blocks serverless egress; validate_seed asserts this matches reality
flags:
  use_managed_memory: false
  use_uc_skills: false
  use_prompt_registry: false
  use_uc_trace_storage: true    # traces of every experiment of this environment are stored in UC tables in `traces_schema` (bootstrap step trace_storage)
  use_managed_mcp: true         # same workspace as demo, where managed MCP is enabled
ui: {app_name: "EQDS Research", subtitle: "Multi-agent research platform", demo_player: true}
schedules:
  enabled: false                # true = wiki refresh and news ingest run on their cron (costs model tokens)
  wiki_refresh_cron: "0 30 7 * * ?"
  wiki_refresh_tz: Asia/Singapore
  ingest_news_cron: "0 */15 * * * ?"
experiment_path: /Shared/eqds-dev/eqds   # experiments: eqds, eqds-moderator, eqds-<key> (agent bundles), all in the dev folder
traces_schema: traces                    # UC schema (in `catalog`) that stores the traces when flags.use_uc_trace_storage is true
# Things this environment uses but does not own, because there is one workspace and one external database. Bootstrap teardown and
# seeding leave them alone: seed_azure refuses to run (it writes), federation_teardown keeps the connection and foreign catalog.
shared_external: true
specialists_deploy: [efm, ours, emquant, broker, experts, news, research, earnings, georev]
github_repo_url: ""
