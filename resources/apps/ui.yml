          value: ${resources.jobs.bridge_worker.id}
        - name: JOB_ID_INGEST_NEWS
          value: ${resources.jobs.ingest_news.id}
        - name: JOB_ID_REGISTER_SPECIALIST
          value: ${resources.jobs.register_specialist.id}
      resources:
      - name: experiment
        experiment:
          experiment_id: ${resources.experiments.exp_main.id}
