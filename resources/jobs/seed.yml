# Synthetic data jobs (design §14.7). All serverless; the jobs that reach the external database use the
# `serverless_*` environment variables rendered by scripts/bundle_vars.py (design §4.1 E8).
resources:
  jobs:
    seed_uc:
      name: ${var.name_prefix}-seed-uc-${var.target_name}
      max_concurrent_runs: 1
      parameters:
        - {name: target, default: "${var.target_name}"}
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_env_version}"
            dependencies: [pandas, numpy, pyyaml]
      tasks:
        - task_key: seed_uc
          environment_key: default
          spark_python_task:
            python_file: ../../src/jobs/seed_uc.py
            parameters: ["--target", "{{job.parameters.target}}", "--root", "${workspace.file_path}"]

    seed_docs:
      name: ${var.name_prefix}-seed-docs-${var.target_name}
      max_concurrent_runs: 1
      parameters:
        - {name: target, default: "${var.target_name}"}
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_env_version}"
            dependencies: [pandas, numpy, pyyaml, reportlab]
      tasks:
        - task_key: seed_docs
          environment_key: default
          spark_python_task:
            python_file: ../../src/jobs/seed_docs.py
            parameters: ["--target", "{{job.parameters.target}}", "--root", "${workspace.file_path}"]

    seed_azure:
      name: ${var.name_prefix}-seed-azure-${var.target_name}
      max_concurrent_runs: 1
      parameters:
        - {name: target, default: "${var.target_name}"}
      environments: ${var.serverless_environments}
      tasks:
        - task_key: seed_azure
          environment_key: ${var.serverless_env_key}
          spark_python_task:
            python_file: ../../src/jobs/seed_azure.py
            parameters: ["--target", "{{job.parameters.target}}", "--root", "${workspace.file_path}"]
