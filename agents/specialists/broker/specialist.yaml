# Specialist definition (design §5.3). Source of truth for the registry row, the app and its access grants.
key: broker
display_name: Brokers
tag_prefix: B
owner: EQDS · research
version: 1.0.1
description: 'Sell-side broker research: ratings, target prices, valuation multiples, demand and supply outlook, recent target changes and dissenting
  views.'
domains:
- brokers
- ratings
- target prices
- valuation
- outlook
model_tier: standard
skill:
  name: broker
  version: 1.0.1
tools:
- type: vector_search
  indexes:
  - name: broker_chunks_idx
    columns:
    - chunk_id
    - doc_id
    - company_id
    - broker
    - rating
    - published_at
    - text
    description: Semantic search over sell-side broker report chunks (rating, target, valuation, outlook). Optional company_id filter.
tools_summary: Vector Search MCP · broker_chunks
access:
  tables:
  - broker_chunks
  - broker_chunks_idx
  - ref_companies
  functions: []
  volumes:
  - skills
  - prompts
max_tool_calls: 8
timeout_s: 150
contract_version: '1'
