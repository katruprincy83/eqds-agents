# Specialist definition (design §5.3). Source of truth for the registry row, the app and its access grants.
key: earnings
display_name: Earnings calls
tag_prefix: EC
owner: EQDS · research
version: 0.9.0
description: 'Earnings calendar and earnings call or results-note content: whether a company has reported, when it reports next, what management
  said about demand, supply and guidance.'
domains:
- earnings
- results
- calls
- guidance
model_tier: standard
skill:
  name: earnings
  version: 0.9.0
tools:
- type: vector_search
  indexes:
  - name: earnings_chunks_idx
    columns:
    - chunk_id
    - call_id
    - company_id
    - fiscal_period
    - call_date
    - doc_type
    - text
    description: Semantic search over earnings call and results-note chunks. Optional company_id filter.
- type: uc_functions
  allow:
  - earnings_events
  - company_lookup
tools_summary: Vector Search MCP · earnings_chunks
access:
  tables:
  - earnings_chunks
  - earnings_chunks_idx
  - earnings_calendar
  - ref_companies
  functions:
  - earnings_events
  - company_lookup
  volumes:
  - skills
  - prompts
max_tool_calls: 8
timeout_s: 150
contract_version: '1'
