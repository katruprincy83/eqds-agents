# Standalone bundle for the {{DISPLAY}} agent: its own repo, its own deploy, no dependency on the orchestrator's bundle.
# It creates ONE Databricks App. The app name follows the platform convention `<prefix>-sp-<key><suffix>`, which is how the
# orchestrator's registration finds it. Platform values below were filled in by the platform's scripts/new_agent.py for
# the {{TARGET}} environment; ask the platform team for the values of other environments.
bundle:
  name: eqds-agent-{{KEY}}

# app/ is generated by scripts/build.py and git-ignored, so it must be listed explicitly to be uploaded.
sync:
  include: [app/**]

variables:
  platform_target: {default: {{TARGET}}}                     # which platform environment the agent plugs into (config/env/<target>.yaml)
  app_name:        {default: {{APP_NAME}}}          # <name_prefix>-sp-<key><suffix>
  warehouse_id:    {default: {{WAREHOUSE_ID}}}             # platform SQL warehouse (tool calls run on it)
  experiment_id:   {default: "{{EXPERIMENT_ID}}"}           # platform MLflow experiment (traces)
  registrar_sp:    {default: {{REGISTRAR_SP}}}   # registrar service principal: manages the app during registration
  ui_sp:           {default: {{UI_SP}}}   # UI service principal: runs the registration contract check
  moderator_sp:    {default: {{MODERATOR_SP}}}   # moderator service principal: calls the agent at run time

resources:
  apps:
    {{KEY}}:
      name: ${var.app_name}
      description: 'Specialist agent: {{DISPLAY}} (standalone)'
      source_code_path: ./app
      config:
        command: [python, -m, uvicorn, agents.specialist_base.app:app, --host, 0.0.0.0, --port, "8000"]
        env:
          - {name: EQDS_TARGET, value: "${var.platform_target}"}
          - {name: EQDS_ROOT, value: "."}
          - {name: EQDS_APP_VERSION, value: "{{VERSION}}"}
          - {name: MLFLOW_EXPERIMENT_ID, value_from: experiment}
          - {name: DATABRICKS_WAREHOUSE_ID, value_from: warehouse}
          - {name: MLFLOW_DISABLE_AGENT_HINT, value: "1"}
          - {name: SPECIALIST_CONFIG, value: agents/specialists/{{KEY}}/specialist.yaml}
      resources:
        - name: experiment
          experiment: {experiment_id: "${var.experiment_id}", permission: CAN_MANAGE}
        - name: warehouse
          sql_warehouse: {id: "${var.warehouse_id}", permission: CAN_USE}
      # The bundle owns the app's whole permission list: anything granted outside it is removed on the next deploy.
      # So every platform identity that needs the app is listed here.
      permissions:
        - {level: CAN_MANAGE, service_principal_name: "${var.registrar_sp}"}
        - {level: CAN_USE, service_principal_name: "${var.ui_sp}"}
        - {level: CAN_USE, service_principal_name: "${var.moderator_sp}"}

targets:
  {{TARGET}}:
    default: true
    workspace:
      host: {{HOST}}
