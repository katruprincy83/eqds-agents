name: pr
on:
  pull_request: {branches: [dev, main]}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: "${{ vars.PLATFORM_REPO }}", ref: "${{ github.base_ref }}", token: "${{ secrets.PLATFORM_REPO_TOKEN }}", path: platform}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml pydantic
      - name: the app builds against the platform runtime of the target branch, for both environments
        run: |
          python scripts/build.py --platform platform --target dev
          python scripts/build.py --platform platform --target demo
      - name: bundle and spec are well-formed, and both targets override every platform value
        run: |
          python - <<'PY'
          import yaml
          b = yaml.safe_load(open("databricks.yml"))
          s = yaml.safe_load(open("agent/specialist.yaml"))
          assert {"demo", "dev"} <= set(b["targets"]), "databricks.yml needs a demo and a dev target"
          need = {"platform_target", "app_name", "experiment_path", "warehouse_id", "registrar_sp", "ui_sp", "moderator_sp"}
          missing = need - set(b["targets"]["dev"].get("variables", {}))
          assert not missing, f"dev target does not override {sorted(missing)}"
          assert b["targets"]["dev"]["variables"]["app_name"].endswith("-dev"), "dev app name must carry the -dev suffix"
          assert s["key"], "specialist.yaml has no key"
          PY
      - name: promotion guard (PRs into main come from dev)
        if: github.base_ref == 'main'
        run: |
          test "${{ github.head_ref }}" = "dev" || { echo "PRs into main must come from the dev branch"; exit 1; }
