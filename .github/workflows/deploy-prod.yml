# Merge to `main` promotes to production (target demo). The `production` GitHub environment must have required reviewers:
# the run waits for approval before anything touches production. workflow_dispatch redeploys a tag or commit (rollback).
name: deploy-prod
on:
  push: {branches: [main]}
  workflow_dispatch:
    inputs:
      ref: {description: "tag or commit to release (default: the branch head)", required: false, default: ""}
jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with: {target: demo, environment: production, ref: "${{ inputs.ref }}"}
    secrets: inherit
