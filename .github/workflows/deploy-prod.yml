name: deploy-prod
on:
  workflow_dispatch:
    inputs:
      ref: {description: "tag or commit to release", required: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment
    env:
      DATABRICKS_HOST: ${{ vars.PROD_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.PROD_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_SP_CLIENT_SECRET }}
      TARGET: prod
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: databricks/setup-cli@main
      - run: pip install -e packages/eqds_llm -e packages/eqds_agentkit pyyaml databricks-sdk psycopg[binary,pool]
      - run: make preflight deploy bootstrap apps outputs
