# Merge to `main` promotes to production (target demo). `main` is protected (pull request + `checks`), so the merge is the approval; add
# required reviewers to the `production` GitHub environment where the plan allows it. workflow_dispatch with a `ref` redeploys a tag or commit (rollback).
name: deploy-prod
on:
  push: {branches: [main]}
  workflow_dispatch:
    inputs:
      ref: {description: "tag or commit to release (default: the branch head)", required: false, default: ""}
jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with: {target: demo, environment: production, ref: "${{ inputs.ref }}"}
    secrets: inherit
