name: deploy-staging
on:
  push: {branches: [main]}
concurrency: deploy-staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_HOST: ${{ vars.STAGING_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.STAGING_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.STAGING_SP_CLIENT_SECRET }}
      TARGET: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: databricks/setup-cli@main
      - run: pip install -e packages/eqds_llm -e packages/eqds_agentkit pyyaml databricks-sdk psycopg[binary,pool]
      - run: make preflight deploy bootstrap apps outputs
