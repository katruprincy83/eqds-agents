name: pr
on: [pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e packages/eqds_llm -e packages/eqds_agentkit pyyaml pytest ruff pandas numpy pydantic fastapi httpx langgraph langchain-core
      - run: ruff check .
      - name: manifest and E1 (no environment-specific values in code)
        run: python scripts/manifest_check.py
      - run: python -m pytest -q tests
      - name: bundle validate for every target
        run: |
          pip install databricks-cli || true
          for t in dev staging prod; do python scripts/bundle_vars.py --target $t; done
