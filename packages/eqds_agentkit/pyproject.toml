[project]
name = "eqds-agentkit"
version = "1.0.0"
description = "EQDS shared agent kit: contract, registry, skills, memory, tracing, auth, lakebase, env profile"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6", "httpx>=0.27", "psycopg[binary,pool]>=3.1", "databricks-sdk>=0.50"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["eqds_agentkit*"]
